---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: Data Product Contract Metadata Injection
    category: Transformation
    description: >-
      Derives a data product's governed identity from Informatica CDGC (a scanned
      asset — schema, flat file, table, etc. — + its columns and Business Terms)
      and stamps it onto responses as x-dp-* headers. Enrichment, headers-only, fail-open.
    metadata/capabilities/injectionPoint: inbound
    metadata/capabilities/assetTypes: mcp,a2a,a2a_v1
    metadata/interfaceScope: api,resource
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    cdgcLoginUrl:
      type: string
      format: service
      description: IDMC login base URL, e.g. https://dm-us.informaticacloud.com.
    cdgcSearchUrl:
      type: string
      format: service
      description: CDGC search host (ccgf-searchv2), e.g. https://cdgc-api.dm-us.informaticacloud.com.
    cdgcOrgUsername:
      type: string
      description: IDMC read-only service-account username.
      "@context": { "@characteristics": [security:sensitive] }
    cdgcOrgPassword:
      type: string
      description: IDMC service-account password.
      "@context": { "@characteristics": [security:sensitive] }
    schemaId:
      type: string
      description: >-
        CDGC asset id of the scanned schema — a flat file, table, etc. The policy
        derives its identity + column summary (names, required, sensitive) from
        CDGC — no per-field config.
    schemaIdHeader:
      type: string
      default: x-dp-schema-id
      description: Optional request header overriding schemaId per request.
    sensitiveMarker:
      type: string
      default: confidential
      description: Case-insensitive substring in a field's Business Term description marking it sensitive.
    headerOnMiss:
      type: boolean
      default: true
      description: Stamp x-dp-metadata-status=unavailable when CDGC metadata can't be resolved (fail-open).
    refreshIntervalSeconds:
      type: integer
      default: 86400
      minimum: 30
      description: Cache TTL for the derived metadata before a lazy CDGC refresh.
    failOpenOnCdgcError:
      type: boolean
      default: true
      description: Serve last-known-good on transient CDGC error; never block (enrichment).
    distributed:
      type: boolean
      default: false
      description: Share cache + refresh lock across replicas (needs shared storage).
    timeout:
      type: integer
      default: 5000
      description: Per-CDGC-call timeout (ms), clamped to a chained budget (~15s).
  required:
    - cdgcLoginUrl
    - cdgcSearchUrl
    - cdgcOrgUsername
    - cdgcOrgPassword
    - schemaId
