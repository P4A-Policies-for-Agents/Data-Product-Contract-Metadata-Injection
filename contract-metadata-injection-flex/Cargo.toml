[package]
name = "contract_metadata_injection"
version = "1.0.7"
rust-version = "1.88.0"
edition = "2018"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.anypoint]
group_id = "030e0aac-30d9-460f-9234-428c16a123c4"
definition_asset_id = { name = "contract-metadata-injection", version = "1.0.7" }
implementation_asset_id = "contract-metadata-injection-flex"

[dependencies]
# enable_stop_iteration: the CDGC fetch runs on the request leg (await-safe) and
# the derived summary is stamped synchronously on the response leg — avoids the
# response-leg fetch racing the response-head commit on a cold cache.
pdk = { version = "1.10.0", features = ["enable_stop_iteration"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
anyhow = "1.0"

[dev-dependencies]
pdk-test = { version = "1.10.0" }
httpmock = "0.6"
reqwest = "0.11"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
